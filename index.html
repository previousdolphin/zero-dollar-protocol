<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZERO DOLLAR PROTOCOL</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #080808;
            --text-color: #e8e8e8;
            --glitch-cyan: #0ff;
            --glitch-magenta: #f0f;
            --ecg-color: rgba(200, 255, 255, 0.15); /* Ghostly faint teal */
        }

        /* --- BASE SETUP --- */
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Archivo Black', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: none;
            user-select: none;
        }

        /* --- LAYERS --- */
        
        /* 1. EKG Canvas (Background) */
        canvas#ekg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; /* Lowest visual layer */
            pointer-events: none;
        }

        /* 2. Film Grain (Middle) */
        .film-grain {
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.12;
            animation: grain-shift 0.2s steps(4) infinite;
            pointer-events: none;
            z-index: 10;
        }

        /* 3. Dither Lens (Top) */
        .lens-dither {
            position: fixed;
            inset: 0;
            z-index: 20;
            pointer-events: none;
            background: #000;
            mask-image: radial-gradient(circle at center, transparent 40%, black 120%);
            -webkit-mask-image: radial-gradient(circle at center, transparent 40%, black 120%);
        }
        
        .lens-dither::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.5'/%3E%3C/svg%3E");
            opacity: 0.4;
            mix-blend-mode: hard-light;
        }

        /* --- TYPOGRAPHY --- */
        .content-wrapper {
            position: relative;
            z-index: 30; /* Above everything */
            mix-blend-mode: difference;
            perspective: 800px;
        }

        h1 {
            font-size: 10vw;
            line-height: 0.8;
            text-transform: uppercase;
            color: var(--text-color);
            margin: 0;
            text-align: center;
            position: relative;
            letter-spacing: -0.06em;
            transform-style: preserve-3d;
            will-change: transform;
        }

        h1::before, h1::after {
            content: "ZERO DOLLAR\A PROTOCOL";
            white-space: pre;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            mix-blend-mode: hard-light;
            opacity: 0.8;
        }

        h1::before {
            color: var(--glitch-cyan);
            z-index: -1;
            clip-path: inset(0 0 0 0);
            animation: glitch-snap-1 4s infinite linear alternate-reverse;
        }

        h1::after {
            color: var(--glitch-magenta);
            z-index: -2;
            clip-path: inset(0 0 0 0);
            animation: glitch-snap-2 3.5s infinite linear alternate-reverse;
        }

        /* --- ANIMATIONS --- */
        @keyframes grain-shift {
            0% { transform: translate(0,0); }
            100% { transform: translate(-5%, -5%); }
        }

        @keyframes glitch-snap-1 {
            0%, 90% { clip-path: inset(0 0 0 0); transform: translate(0); }
            91% { clip-path: inset(20% 0 50% 0); transform: translate(-2px, 2px); }
            92% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -2px); }
            93% { clip-path: inset(0 0 0 0); transform: translate(0); }
            100% { clip-path: inset(0 0 0 0); transform: translate(0); }
        }

        @keyframes glitch-snap-2 {
            0%, 85% { clip-path: inset(0 0 0 0); transform: translate(0); }
            86% { clip-path: inset(40% 0 30% 0); transform: translate(2px, 2px); }
            87% { clip-path: inset(0 0 0 0); transform: translate(0); }
            100% { clip-path: inset(0 0 0 0); transform: translate(0); }
        }

        /* Strobe Effect Class */
        .flash-bang {
            filter: invert(1) contrast(200%);
            background-color: white !important;
        }
        .flash-bang h1 { color: black !important; }

    </style>
</head>
<body>

    <canvas id="ekg"></canvas>
    <div class="film-grain"></div>
    <div class="lens-dither"></div>

    <div class="content-wrapper" id="scene">
        <h1 id="title">ZERO DOLLAR<br>PROTOCOL</h1>
    </div>

    <script>
        // --- CONFIGURATION ---
        const STROBE_MIN = 5000;
        const STROBE_MAX = 10000;
        
        const BPM_RESTING = 69;
        const BPM_MAX = 140;
        const DECAY_RATE = 0.1; // How fast it calms down per frame
        
        // --- ELEMENTS ---
        const body = document.body;
        const title = document.getElementById('title');
        const canvas = document.getElementById('ekg');
        const ctx = canvas.getContext('2d');

        // --- HEARTBEAT STATE ---
        let currentBPM = BPM_RESTING;
        let targetBPM = BPM_RESTING;
        let lastBeatTime = 0;
        
        // EKG Drawing State
        let xPos = 0;
        let yBase = window.innerHeight / 2;
        const speed = 2; // Horizontal scroll speed
        let beatPhase = 0; // Where we are in the QRS complex
        // The QRS complex shape (Y-offsets)
        const beatPattern = [0, 5, 10, -10, -50, 80, -20, 10, 5, 0]; 

        // --- INIT CANVAS ---
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            yBase = window.innerHeight / 2; // Recenter line
            
            // Setup drawing style
            ctx.strokeStyle = "rgba(200, 255, 255, 0.1)"; // Ghostly line
            ctx.lineWidth = 1.5;
            ctx.lineJoin = 'round';
            ctx.shadowBlur = 5;
            ctx.shadowColor = "rgba(200, 255, 255, 0.3)";
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- THE LOOP ---
        function animate() {
            const now = Date.now();
            
            // 1. CALM DOWN LOGIC
            if (targetBPM > BPM_RESTING) {
                targetBPM -= DECAY_RATE; 
            }
            // Smoothly move current to target
            currentBPM += (targetBPM - currentBPM) * 0.05;

            // 2. CHECK FOR BEAT
            const msPerBeat = 60000 / currentBPM;
            if (now - lastBeatTime > msPerBeat && beatPhase === 0) {
                lastBeatTime = now;
                beatPhase = 1; // Trigger the wave pattern
            }

            // 3. CALCULATE Y POSITION
            let yOffset = 0;

            if (beatPhase > 0) {
                // We are in a beat, cycle through the pattern
                // Use beatPhase as index, increment it slowly
                const index = Math.floor(beatPhase);
                if (index < beatPattern.length) {
                    yOffset = beatPattern[index];
                    beatPhase += 0.4; // Speed of the spike drawing
                } else {
                    beatPhase = 0; // Reset to flatline
                }
            } else {
                // Resting jitter (noise)
                yOffset = (Math.random() - 0.5) * 4;
            }

            // 4. DRAW
            // Fade out the old line to create "scan" effect
            ctx.fillStyle = 'rgba(8, 8, 8, 0.05)'; // Dark fade
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            ctx.moveTo(xPos, yBase + (window.prevY || 0));
            
            xPos += speed;
            const newY = yOffset;
            
            ctx.lineTo(xPos, yBase + newY);
            ctx.stroke();

            window.prevY = newY;

            // Loop back to start of screen
            if (xPos > canvas.width) {
                xPos = 0;
                ctx.moveTo(0, yBase);
            }

            requestAnimationFrame(animate);
        }

        // --- INTERACTION ---
        
        // Mouse Move = Mild Stress
        document.addEventListener('mousemove', (e) => {
            if (targetBPM < BPM_MAX) {
                targetBPM += 0.4; // Slowly rise
            }
            
            // Parallax Text
            const x = (window.innerWidth / 2 - e.pageX) / 40;
            const y = (window.innerHeight / 2 - e.pageY) / 40;
            title.style.transform = `rotateX(${y}deg) rotateY(${-x}deg)`;
        });

        // Click = Adrenaline Spike
        document.addEventListener('mousedown', () => {
            if (targetBPM < BPM_MAX) {
                targetBPM += 15; // Big jump
            }
            // Add a little visual shake to the title
            title.style.transform = `scale(1.1)`;
            setTimeout(() => { title.style.transform = `scale(1)`; }, 100);
        });

        // --- STROBE ENGINE (From previous request) ---
        function triggerStrobe() {
            const nextDelay = Math.floor(Math.random() * (STROBE_MAX - STROBE_MIN + 1) + STROBE_MIN);
            const type = Math.random() > 0.7 ? 'double' : 'single';

            if (type === 'single') {
                performFlash(60);
            } else {
                performFlash(40);
                setTimeout(() => performFlash(100), 120);
            }
            setTimeout(triggerStrobe, nextDelay);
        }

        function performFlash(duration) {
            body.classList.add('flash-bang');
            setTimeout(() => body.classList.remove('flash-bang'), duration);
        }

        // Start
        animate();
        setTimeout(triggerStrobe, 2000);

    </script>
</body>
</html>
