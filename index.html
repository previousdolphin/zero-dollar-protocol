<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZERO DOLLAR PROTOCOL</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050505;
            --text-color: #f0f0f0;
            --glitch-cyan: #0ff;
            --glitch-magenta: #f0f;
        }

        /* --- BASE SETUP --- */
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Archivo Black', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: crosshair; 
            user-select: none;
        }

        /* --- LAYERS --- */
        
        /* 1. EKG (Bottom Layer) */
        canvas#ekg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; 
            pointer-events: none;
            opacity: 0.6; /* Slightly more visible now that lines are thicker */
        }

        /* 2. Global Grain (The "Fuzz") */
        /* Changed to use steps() to prevent "raining" slide effect */
        .film-grain {
            position: fixed;
            top: -100%; left: -100%; width: 300%; height: 300%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.1;
            /* steps(10) creates the jitter/fuzz look instead of smooth sliding */
            animation: fuzz-bounce 0.8s steps(10) infinite; 
            pointer-events: none;
            z-index: 5;
        }

        /* 3. Crunchy Vignette (Top Layer) */
        .dither-vignette {
            position: fixed;
            inset: 0;
            z-index: 100;
            pointer-events: none;
            /* High contrast noise mask for edges */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='1' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3CfeComponentTransfer%3E%3CfeFuncR type='discrete' tableValues='0 1'/%3E%3CfeFuncG type='discrete' tableValues='0 1'/%3E%3CfeFuncB type='discrete' tableValues='0 1'/%3E%3C/feComponentTransfer%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            background-size: 100px 100px;
            
            /* Responsive Vignette Mask */
            -webkit-mask-image: radial-gradient(circle at center, transparent 40%, black 100%);
            mask-image: radial-gradient(circle at center, transparent 40%, black 100%);
            
            mix-blend-mode: multiply;
            opacity: 0.9;
        }

        /* --- TYPOGRAPHY --- */
        .content-wrapper {
            position: relative;
            z-index: 10;
            perspective: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            /* Responsive Sizing Logic */
            /* Mobile Default (Portrait) */
            font-size: 18vw; 
            line-height: 0.85;
            
            text-transform: uppercase;
            color: var(--text-color);
            margin: 0;
            text-align: center;
            position: relative;
            letter-spacing: -0.05em;
            will-change: transform, filter, opacity;
            transition: transform 0.1s;
            
            /* Sharp edges */
            -webkit-font-smoothing: antialiased;
        }

        /* Landscape / Large Screen Adjustment */
        @media (min-aspect-ratio: 1/1) {
            h1 {
                font-size: 8vw; /* Smaller vw on wide screens so it fits vertically */
                line-height: 0.9;
            }
        }

        /* Standard Glitch Layers */
        h1::before, h1::after {
            content: attr(data-text); 
            white-space: pre;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            mix-blend-mode: hard-light;
            opacity: 0.7;
        }

        h1::before {
            color: var(--glitch-cyan);
            z-index: -1;
            clip-path: inset(0 0 0 0);
            animation: glitch-idle-1 4s infinite linear alternate-reverse;
        }

        h1::after {
            color: var(--glitch-magenta);
            z-index: -2;
            clip-path: inset(0 0 0 0);
            animation: glitch-idle-2 3.5s infinite linear alternate-reverse;
        }

        /* --- ANIMATIONS --- */
        
        /* The Fuzz Animation: Random Jumps */
        @keyframes fuzz-bounce {
            0% { transform: translate(0,0); }
            10% { transform: translate(-5%, -5%); }
            20% { transform: translate(2%, 2%); }
            30% { transform: translate(-2%, 5%); }
            40% { transform: translate(5%, -2%); }
            50% { transform: translate(-2%, -2%); }
            60% { transform: translate(5%, 5%); }
            70% { transform: translate(-5%, 2%); }
            80% { transform: translate(2%, -5%); }
            90% { transform: translate(-2%, 2%); }
            100% { transform: translate(0,0); }
        }

        /* Idle Glitch Movements */
        @keyframes glitch-idle-1 {
            0%, 95% { clip-path: inset(0 0 0 0); transform: translate(0); }
            96% { clip-path: inset(20% 0 50% 0); transform: translate(-3px, 1px); }
            100% { clip-path: inset(0 0 0 0); transform: translate(0); }
        }
        @keyframes glitch-idle-2 {
            0%, 90% { clip-path: inset(0 0 0 0); transform: translate(0); }
            91% { clip-path: inset(40% 0 30% 0); transform: translate(3px, -1px); }
            100% { clip-path: inset(0 0 0 0); transform: translate(0); }
        }

        /* --- THE GLITCH ROULETTE STATES --- */
        .glitch-slice h1 {
            clip-path: polygon(0 30%, 100% 30%, 100% 70%, 0 70%);
            transform: skewX(40deg) translateX(-15px) !important;
            filter: blur(2px);
        }
        .glitch-crush h1 {
            transform: scaleY(0.01) scaleX(1.2) !important;
            opacity: 0.5;
            filter: brightness(200%);
        }
        .glitch-invert h1 {
            filter: invert(1);
            color: #000;
        }
        .glitch-blur h1 {
            filter: blur(10px);
            opacity: 0.8;
            letter-spacing: 0.1em;
        }

    </style>
</head>
<body>

    <canvas id="ekg"></canvas>
    <div class="film-grain"></div>
    <div class="dither-vignette"></div>

    <div class="content-wrapper" id="scene">
        <h1 id="title" data-text="ZERO&#10;DOLLAR&#10;PROTOCOL">ZERO<br>DOLLAR<br>PROTOCOL</h1>
    </div>

    <script>
        // --- CONFIGURATION ---
        const BPM_RESTING = 69;
        const BPM_MAX = 140;
        
        // --- ELEMENTS ---
        const title = document.getElementById('title');
        const container = document.getElementById('scene');
        const canvas = document.getElementById('ekg');
        const ctx = canvas.getContext('2d');

        // --- HEARTBEAT LOGIC ---
        let currentBPM = BPM_RESTING;
        let targetBPM = BPM_RESTING;
        let lastBeatTime = 0;
        let xPos = 0;
        let yBase = 0;
        let beatPhase = 0;
        // Sharper, higher amplitude QRS complex
        const beatPattern = [0, -20, 30, -30, -120, 180, -50, 20, -10, 0]; 

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Floor is lower third
            yBase = window.innerHeight * 0.8; 
            
            // THICKER LINES HERE
            ctx.strokeStyle = "rgba(0, 255, 255, 0.6)"; 
            ctx.lineWidth = 4; // Thicker line
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.shadowBlur = 20; // Stronger glow
            ctx.shadowColor = "rgba(0, 255, 255, 0.9)";
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function animateHeart() {
            if (targetBPM > BPM_RESTING) targetBPM -= 0.2; 
            currentBPM += (targetBPM - currentBPM) * 0.1;

            const msPerBeat = 60000 / currentBPM;
            const now = Date.now();

            if (now - lastBeatTime > msPerBeat && beatPhase === 0) {
                lastBeatTime = now;
                beatPhase = 1; 
            }

            // Draw Background Fade (Simulates phosphor decay)
            ctx.fillStyle = 'rgba(5, 5, 5, 0.15)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.beginPath();
            ctx.moveTo(xPos, yBase + (window.prevY || 0));

            let yOffset = 0;
            if (beatPhase > 0) {
                const index = Math.floor(beatPhase);
                if (index < beatPattern.length) {
                    yOffset = beatPattern[index];
                    beatPhase += 0.5;
                } else { beatPhase = 0; }
            } else {
                // Resting jitter 
                yOffset = (Math.random() - 0.5) * 3; 
            }

            xPos += 4; // Slightly faster scroll
            ctx.lineTo(xPos, yBase + yOffset);
            ctx.stroke();
            window.prevY = yOffset;

            if (xPos > canvas.width) {
                xPos = 0;
                ctx.moveTo(0, yBase);
            }
            requestAnimationFrame(animateHeart);
        }

        // --- GLITCH ENGINE ---
        const SUBLIMINALS = ["NULL", "VOID", "0.00", "ERROR", "DEBT", "ZERO"];

        function glitchRoulette() {
            const delay = Math.random() * 4000 + 3000;
            const roll = Math.floor(Math.random() * 5);
            
            // Standard Text for Reset
            const originalHTML = "ZERO<br>DOLLAR<br>PROTOCOL";
            const originalData = "ZERO\nDOLLAR\nPROTOCOL";

            switch(roll) {
                case 0: // SUBLIMINAL
                    const word = SUBLIMINALS[Math.floor(Math.random() * SUBLIMINALS.length)];
                    // Repeat word 3 times for visual consistency in the stack
                    const stack = `${word}\n${word}\n${word}`;
                    const stackHTML = `${word}<br>${word}<br>${word}`;
                    
                    updateText(stackHTML, stack);
                    setTimeout(() => updateText(originalHTML, originalData), 120);
                    break;

                case 1: // SLICE
                    container.classList.add('glitch-slice');
                    setTimeout(() => container.classList.remove('glitch-slice'), 150);
                    break;

                case 2: // CRUSH
                    container.classList.add('glitch-crush');
                    setTimeout(() => container.classList.remove('glitch-crush'), 100);
                    break;

                case 3: // INVERT
                    container.classList.add('glitch-invert');
                    setTimeout(() => container.classList.remove('glitch-invert'), 80);
                    break;
                
                case 4: // BLUR
                    container.classList.add('glitch-blur');
                    setTimeout(() => container.classList.remove('glitch-blur'), 200);
                    break;
            }
            setTimeout(glitchRoulette, delay);
        }

        function updateText(html, attr) {
            title.innerHTML = html;
            title.setAttribute('data-text', attr);
        }

        // --- INTERACTION ---
        document.addEventListener('mousemove', (e) => {
            if (targetBPM < BPM_MAX) targetBPM += 0.5;
            
            const x = (window.innerWidth / 2 - e.pageX) / 40;
            const y = (window.innerHeight / 2 - e.pageY) / 40;
            title.style.transform = `rotateX(${y}deg) rotateY(${-x}deg)`;
        });

        document.addEventListener('mousedown', () => {
            if (targetBPM < BPM_MAX) targetBPM += 20;
            title.style.transform = `scale(1.05)`;
            setTimeout(() => title.style.transform = `scale(1)`, 100);
            container.classList.add('glitch-invert');
            setTimeout(() => container.classList.remove('glitch-invert'), 50);
        });

        // Init
        animateHeart();
        setTimeout(glitchRoulette, 2000);

    </script>
</body>
</html>
