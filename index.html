<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZERO DOLLAR PROTOCOL</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050505;
            --text-color: #f0f0f0;
            --glitch-cyan: #0ff;
            --glitch-magenta: #f0f;
        }

        /* --- BASE SETUP --- */
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Archivo Black', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: crosshair; /* Brutalist cursor */
            user-select: none;
        }

        /* --- LAYERS (Bottom to Top) --- */
        
        /* 1. EKG Canvas (Background, moved to bottom) */
        canvas#ekg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; 
            pointer-events: none;
            opacity: 0.6; /* Slight boost since it's lower now */
        }

        /* 2. Global Film Grain (Subtle texture everywhere) */
        .film-grain {
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.08;
            animation: grain-shift 0.2s steps(4) infinite;
            pointer-events: none;
            z-index: 5;
        }

        /* 3. THE CRUNCHY LENS (The requested "Dither" effect) */
        /* This creates a heavy noise ring around the edges */
        .dither-vignette {
            position: fixed;
            inset: 0;
            z-index: 50; /* Sits ON TOP of text */
            pointer-events: none;
            
            /* The noise pattern: coarse and high contrast */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='1' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3CfeComponentTransfer%3E%3CfeFuncR type='discrete' tableValues='0 1'/%3E%3CfeFuncG type='discrete' tableValues='0 1'/%3E%3CfeFuncB type='discrete' tableValues='0 1'/%3E%3C/feComponentTransfer%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            background-size: 150px 150px;
            
            /* The Mask: Clear in center, Opaque at edges */
            -webkit-mask-image: radial-gradient(circle at center, transparent 30%, black 90%);
            mask-image: radial-gradient(circle at center, transparent 30%, black 90%);
            
            /* Blend mode to make it darken the scene "crunchily" */
            mix-blend-mode: multiply;
            opacity: 0.8;
        }

        /* 4. CONTENT WRAPPER */
        .content-wrapper {
            position: relative;
            z-index: 10; /* Above grain, below dither lens */
            perspective: 800px;
            /* Removed mix-blend-mode difference to fix overlap issues */
        }

        h1 {
            font-size: 11vw;
            line-height: 0.8;
            text-transform: uppercase;
            color: var(--text-color);
            margin: 0;
            text-align: center;
            position: relative;
            letter-spacing: -0.06em;
            transform-style: preserve-3d;
            will-change: transform;
            text-shadow: 0 0 20px rgba(0,0,0,0.8); /* Lift text off background */
        }

        /* GLITCH LAYERS (The cyan/magenta split) */
        h1::before, h1::after {
            content: "ZERO DOLLAR\A PROTOCOL";
            white-space: pre;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent; /* Changed from solid to transparent to avoid blocking */
            mix-blend-mode: screen; /* Lightens the glitch */
            opacity: 0.7;
        }

        h1::before {
            color: var(--glitch-cyan);
            z-index: -1;
            clip-path: inset(0 0 0 0);
            animation: glitch-snap-1 4s infinite linear alternate-reverse;
            transform: translate(-2px, 0);
        }

        h1::after {
            color: var(--glitch-magenta);
            z-index: -2;
            clip-path: inset(0 0 0 0);
            animation: glitch-snap-2 3.5s infinite linear alternate-reverse;
            transform: translate(2px, 0);
        }

        /* --- ANIMATIONS --- */
        @keyframes grain-shift {
            0% { background-position: 0% 0%; }
            100% { background-position: 10% 10%; }
        }

        @keyframes glitch-snap-1 {
            0%, 92% { clip-path: inset(0 0 0 0); transform: translate(0); }
            93% { clip-path: inset(20% 0 50% 0); transform: translate(-4px, 2px); }
            94% { clip-path: inset(60% 0 10% 0); transform: translate(4px, -2px); }
            95% { clip-path: inset(0 0 0 0); transform: translate(0); }
            98% { clip-path: inset(10% 0 70% 0); transform: translate(3px, 0); }
            100% { clip-path: inset(0 0 0 0); transform: translate(0); }
        }

        @keyframes glitch-snap-2 {
            0%, 88% { clip-path: inset(0 0 0 0); transform: translate(0); }
            89% { clip-path: inset(40% 0 30% 0); transform: translate(3px, 3px); }
            90% { clip-path: inset(0 0 0 0); transform: translate(0); }
            100% { clip-path: inset(0 0 0 0); transform: translate(0); }
        }

        /* Strobe Effect */
        .flash-bang {
            filter: invert(1) contrast(150%);
            background-color: #ddd !important;
        }
        /* Ensure text stays readable (inverted to black) during flash */
        .flash-bang h1 { 
            color: #111 !important;
            text-shadow: none;
        }

    </style>
</head>
<body>

    <canvas id="ekg"></canvas>
    <div class="film-grain"></div>
    <div class="dither-vignette"></div>

    <div class="content-wrapper" id="scene">
        <h1 id="title">ZERO DOLLAR<br>PROTOCOL</h1>
    </div>

    <script>
        // --- CONFIGURATION ---
        const STROBE_MIN = 5000;
        const STROBE_MAX = 10000;
        
        const BPM_RESTING = 69;
        const BPM_MAX = 140;
        const DECAY_RATE = 0.2; 
        
        // --- ELEMENTS ---
        const body = document.body;
        const title = document.getElementById('title');
        const canvas = document.getElementById('ekg');
        const ctx = canvas.getContext('2d');

        // --- HEARTBEAT STATE ---
        let currentBPM = BPM_RESTING;
        let targetBPM = BPM_RESTING;
        let lastBeatTime = 0;
        
        // EKG Drawing State
        let xPos = 0;
        let yBase = 0; // Set in resize
        const speed = 3; 
        let beatPhase = 0; 
        // Sharper QRS complex
        const beatPattern = [0, -10, 15, -15, -80, 120, -30, 15, -10, 0]; 

        // --- INIT CANVAS ---
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Move EKG to bottom 25% of screen to avoid text overlap
            yBase = window.innerHeight * 0.75; 
            
            ctx.strokeStyle = "rgba(0, 255, 255, 0.4)"; 
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';
            ctx.shadowBlur = 10;
            ctx.shadowColor = "rgba(0, 255, 255, 0.8)";
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- THE LOOP ---
        function animate() {
            const now = Date.now();
            
            // 1. CALM DOWN LOGIC
            if (targetBPM > BPM_RESTING) {
                targetBPM -= DECAY_RATE; 
            }
            // Smoothly move current to target
            currentBPM += (targetBPM - currentBPM) * 0.1;

            // 2. CHECK FOR BEAT
            const msPerBeat = 60000 / currentBPM;
            if (now - lastBeatTime > msPerBeat && beatPhase === 0) {
                lastBeatTime = now;
                beatPhase = 1; 
            }

            // 3. CALCULATE Y POSITION
            let yOffset = 0;

            if (beatPhase > 0) {
                const index = Math.floor(beatPhase);
                if (index < beatPattern.length) {
                    yOffset = beatPattern[index];
                    beatPhase += 0.5; 
                } else {
                    beatPhase = 0; 
                }
            } else {
                // Resting jitter 
                yOffset = (Math.random() - 0.5) * 2;
            }

            // 4. DRAW
            // Fade out trail
            ctx.fillStyle = 'rgba(5, 5, 5, 0.1)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            ctx.moveTo(xPos, yBase + (window.prevY || 0));
            
            xPos += speed;
            const newY = yOffset;
            
            ctx.lineTo(xPos, yBase + newY);
            ctx.stroke();

            window.prevY = newY;

            if (xPos > canvas.width) {
                xPos = 0;
                ctx.moveTo(0, yBase);
            }

            requestAnimationFrame(animate);
        }

        // --- INTERACTION ---
        document.addEventListener('mousemove', (e) => {
            if (targetBPM < BPM_MAX) targetBPM += 0.5; 
            
            // Parallax Text
            const x = (window.innerWidth / 2 - e.pageX) / 30;
            const y = (window.innerHeight / 2 - e.pageY) / 30;
            title.style.transform = `rotateX(${y}deg) rotateY(${-x}deg)`;
        });

        document.addEventListener('mousedown', () => {
            if (targetBPM < BPM_MAX) targetBPM += 20; 
            title.style.transform = `scale(1.15)`;
            setTimeout(() => { title.style.transform = `scale(1)`; }, 100);
        });

        // --- STROBE ENGINE ---
        function triggerStrobe() {
            const nextDelay = Math.floor(Math.random() * (STROBE_MAX - STROBE_MIN + 1) + STROBE_MIN);
            const type = Math.random() > 0.7 ? 'double' : 'single';

            if (type === 'single') {
                performFlash(60);
            } else {
                performFlash(40);
                setTimeout(() => performFlash(100), 120);
            }
            setTimeout(triggerStrobe, nextDelay);
        }

        function performFlash(duration) {
            body.classList.add('flash-bang');
            setTimeout(() => body.classList.remove('flash-bang'), duration);
        }

        // Start
        animate();
        setTimeout(triggerStrobe, 2000);

    </script>
</body>
</html>
