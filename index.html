<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZERO DOLLAR PROTOCOL</title>
    <style>
        /* --- RESET & BASE --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: crosshair; /* Brutalist cursor */
        }

        body {
            background-color: #050505;
            color: #e0e0e0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Helvetica Neue', 'Arial Black', sans-serif;
            perspective: 1000px;
        }

        /* --- FILM GRAIN & NOISE LAYERS --- */
        .noise-overlay {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.15;
            pointer-events: none;
            animation: grain-dance 0.2s steps(4) infinite;
            z-index: 10;
            mix-blend-mode: overlay;
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.4) 50%,
                rgba(0,0,0,0.4)
            );
            background-size: 100% 4px;
            z-index: 11;
            pointer-events: none;
        }

        /* --- MAIN CONTAINER --- */
        .container {
            position: relative;
            z-index: 5;
            filter: contrast(120%) brightness(110%);
            transform: scale(1);
            transition: transform 0.1s;
        }

        /* --- TYPOGRAPHY --- */
        h1 {
            font-size: 9vw;
            line-height: 0.85;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            font-weight: 900;
            text-align: center;
            position: relative;
            color: #fff;
            mix-blend-mode: difference;
            /* The glitch layers */
        }

        /* The RGB Split layers using pseudo-elements */
        h1::before, h1::after {
            content: "ZERO DOLLAR\A PROTOCOL"; /* \A is a line break in CSS content */
            white-space: pre;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505; /* Matches body to hide main text */
            opacity: 0.7;
        }

        h1::before {
            color: #0ff; /* Cyan */
            z-index: -1;
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            mix-blend-mode: screen;
        }

        h1::after {
            color: #f0f; /* Magenta */
            z-index: -2;
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
            clip-path: polygon(0 80%, 100% 20%, 100% 100%, 0 100%);
            mix-blend-mode: screen;
        }

        /* --- ANIMATIONS --- */
        
        /* Simulates film jumping in the projector gate */
        @keyframes grain-dance {
            0% { transform: translate(0,0); }
            10% { transform: translate(-5%, -5%); }
            20% { transform: translate(-10%, 5%); }
            30% { transform: translate(5%, -10%); }
            40% { transform: translate(-5%, 15%); }
            50% { transform: translate(-10%, 5%); }
            60% { transform: translate(15%, 0); }
            70% { transform: translate(0, 10%); }
            80% { transform: translate(-15%, 0); }
            90% { transform: translate(10%, 5%); }
            100% { transform: translate(5%, 0); }
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
            80% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, 1px); }
            100% { clip-path: inset(30% 0 50% 0); transform: translate(1px, -1px); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -1px); }
            20% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, 2px); }
            40% { clip-path: inset(30% 0 20% 0); transform: translate(2px, 1px); }
            60% { clip-path: inset(15% 0 80% 0); transform: translate(-1px, -2px); }
            80% { clip-path: inset(55% 0 10% 0); transform: translate(1px, 2px); }
            100% { clip-path: inset(40% 0 30% 0); transform: translate(-2px, 1px); }
        }

        /* Occasional aggressive strobe */
        @keyframes strobe {
            0% { background-color: #050505; filter: invert(0); }
            95% { background-color: #050505; filter: invert(0); }
            96% { background-color: #fff; filter: invert(1); }
            97% { background-color: #050505; filter: invert(0); }
            98% { background-color: #fff; filter: invert(1); }
            100% { background-color: #050505; filter: invert(0); }
        }

        .strobe-active {
            animation: strobe 4s infinite;
        }

        /* Vignette to darken edges like old film */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, black 100%);
            z-index: 20;
            pointer-events: none;
        }
    </style>
</head>
<body class="strobe-active">

    <div class="noise-overlay"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="container">
        <h1>
            ZERO DOLLAR<br>PROTOCOL
        </h1>
    </div>

    <script>
        // JS adds random "jitter" to the text size to make it feel unstable/explosive
        const container = document.querySelector('.container');
        
        setInterval(() => {
            if(Math.random() > 0.8) {
                // Random scale bump
                const scale = 1 + (Math.random() * 0.05);
                container.style.transform = `scale(${scale})`;
                
                // Random text skew
                const skewX = (Math.random() * 10) - 5;
                container.style.transform += ` skewX(${skewX}deg)`;
            } else {
                container.style.transform = 'scale(1) skewX(0deg)';
            }
        }, 100);
    </script>
</body>
</html>
